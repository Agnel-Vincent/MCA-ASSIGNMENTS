<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDG Round Robin Scheduling Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Header with Page Title and Assignment Details -->
  <header class="app-header">
    <h1 class="page-title">SDG Round Robin Scheduling Simulator</h1>
    <p class="page-subtitle">Agnel T Vincent | MCA | Semester 1 | Operating Systems, Assignment 1</p>
  </header>

  <!-- Two-card Layout: Input on Left, Output on Right -->
  <main class="main-layout">

    <!-- Left Card: Input Parameters -->
    <aside class="card input-card">
      <h2 class="card-heading">Input</h2>

      <!-- Input Form Fields -->
      <form id="scheduler-form" onsubmit="return false;">
        <!-- Process Configuration Table (Row-wise AT & BT) -->
        <div class="process-table-section">
          <div class="table-header-row">
            <label class="form-section-label">Processes (Arrival &amp; Burst Times)</label>
            <span id="process-counter" class="process-counter">4 processes</span>
          </div>

          <div class="process-table-container">
            <table class="table input-table" id="process-input-table">
              <thead>
                <tr>
                  <th scope="col" style="width: 52px;">PID</th>
                  <th scope="col">Task Description</th>
                  <th scope="col" style="width: 72px;" class="text-right">AT (ms)</th>
                  <th scope="col" style="width: 72px;" class="text-right">BT (ms)</th>
                  <th scope="col" style="width: 38px;" class="text-center"></th>
                </tr>
              </thead>
              <tbody id="process-table-body">
                <!-- Dynamically populated process rows -->
              </tbody>
            </table>
          </div>

          <div class="table-actions">
            <button type="button" id="add-process-btn" class="btn-add-process">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Add Process
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="quantum-input">Time Quantum</label>
          <input type="number" id="quantum-input" value="2" min="1" placeholder="e.g. 2">
        </div>

        <div class="form-group">
          <label for="overhead-input">Context Switch Overhead (ms)</label>
          <input type="number" id="overhead-input" value="0" min="0" placeholder="0 means no overhead">
        </div>

        <div class="form-group">
          <label for="compare-quantum-input">Compare with Time Quantum (optional)</label>
          <input type="number" id="compare-quantum-input" value="3" min="1" placeholder="e.g. 3">
        </div>

        <!-- Scenario Information Callout (shown when a preset is loaded) -->
        <div id="scenario-note" class="scenario-note" style="display: none;"></div>

        <!-- Primary Action Button -->
        <button type="button" id="solve-btn" class="btn btn-primary">Solve</button>

        <!-- Preset Buttons -->
        <div class="preset-group">
          <button type="button" id="btn-activity-1" class="btn btn-outline">Load Activity 1</button>
          <button type="button" id="btn-activity-2" class="btn btn-outline">Load Activity 2</button>
        </div>

        <!-- Error Alert Message -->
        <div id="error-message" class="error-message" role="alert" style="display: none;"></div>
      </form>
    </aside>

    <!-- Right Card: Output Results -->
    <section class="card output-card">
      <div class="output-header">
        <h2 class="card-heading">Output</h2>
        <span class="badge-rr">RR</span>
      </div>

      <!-- Container where results (Gantt, Tables, Summaries) are rendered -->
      <div id="output-content" class="output-content">
        <!-- Rendered dynamically by script.js -->
      </div>
    </section>

  </main>

  <!-- Muted Footer showing Self-Test Result -->
  <footer class="app-footer">
    <p id="self-test-line" class="self-test-text">Running self-test...</p>
  </footer>

  <!-- Scheduling Engine and UI Logic -->
  <script src="script.js"></script>
</body>
</html>
